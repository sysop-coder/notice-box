<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>豐東國中 - 民意信箱管理後台</title>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; padding: 24px; background: #edf2f7; font-size: 16px; color: #2d3748; margin: 0; }
    .card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h2 { font-size: 24px; color: #2b6cb0; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
    .user-badge { font-size: 14px; background: #ebf8ff; color: #2b6cb0; padding: 6px 12px; border-radius: 20px; font-weight: bold; border: 1px solid #bee3f8; }
    button { padding: 10px 16px; font-size: 15px; border: none; border-radius: 6px; background-color: #3182ce; color: white; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #2b6cb0; }
    .btn-outline { background: white; color: #4a5568; border: 1px solid #cbd5e0; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 15px; }
    th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; vertical-align: top; }
    th { background: #f7fafc; color: #4a5568; font-weight: bold; }
    .status-badge { padding: 4px 10px; border-radius: 14px; font-size: 13px; font-weight: bold; color: white; background: #3182ce; display: inline-block; }
    // 渲染表格
  function renderTable(cases) {
    const tbody = document.getElementById('caseBody');
    tbody.innerHTML = cases.map(c => {
      const deptOptions = g_availableDepts.map(d => `<option value="${d}" ${d===c.dept?'selected':''}>${d}</option>`).join('');
      
      // 1. 動態變更回覆按鈕的文字
      let actionBtnText = '結案並填寫回覆';
      if (c.status === '已結案' || c.status === '結案') {
        actionBtnText = '結案並已寄通知信';
      } else if (c.status === '儲存回覆') {
        actionBtnText = '儲存回覆說明';
      }
      
      // 2. 標記處理中按鈕的消失邏輯：當狀態已推進到處理中或更後面的階段時，不渲染該按鈕
      const hideProcessingBtn = (c.status === '處理中' || c.status === '儲存回覆' || c.status === '已結案' || c.status === '結案');
      const processBtnHtml = hideProcessingBtn ? '' : `<button onclick="markProcessing(${c.rowIndex})" style="padding:6px; font-size:13px; margin-bottom:5px; width:100%; background:#805ad5;">標記處理中</button>`;

      return `<tr>
        <td><strong style="color:#2b6cb0;">${c.caseId}</strong></td>
        <td>${c.createdAt}</td>
        <td>
          <strong style="color:#e53e3e">${c.dept}</strong>
          <select class="reassign-select" id="dept_${c.rowIndex}" onchange="reassignCase(${c.rowIndex}, '${c.dept}')">
            <option value="" disabled>--- 轉派案件 ---</option>
            ${deptOptions}
          </select>
        </td>
        <td style="max-width:280px;"><strong>${c.subject}</strong><br><small style="color:#4a5568;">${c.content}</small></td>
        <td><strong>${c.name}</strong><br>${c.phone}</td>
        <td><span class="status-badge tag-${c.status}">${c.status}</span></td>
        <td>
          ${processBtnHtml}
          <button onclick="openReplyModal(${c.rowIndex})" style="padding:6px; font-size:13px; background:#38a169; width:100%;">${actionBtnText}</button>
        </td>
      </tr>`;
    }).join('');
  }
    
    /* 轉派選單 */
    .reassign-select { margin-top: 8px; width: 100%; padding: 6px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 13px; }
    
    /* 確保隱藏優先權最高 */
    .hidden { display: none !important; }
    #loader { text-align: center; font-size: 18px; color: #718096; padding: 50px; }
    
    /* 權限阻擋畫面 */
    .error-card { max-width: 500px; margin: 80px auto; text-align: center; padding: 40px; border-top: 5px solid #e53e3e; }

    /* 高級經典彈跳視窗 (Modal) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.45); display: flex; justify-content: center; align-items: center; z-index: 1000;
      backdrop-filter: blur(2px);
    }
    .modal-box {
      background: #ffffff; width: 92%; max-width: 680px; border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18); overflow: hidden; animation: modalPop 0.2s ease-out;
    }
    @keyframes modalPop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-header {
      background: #2b6cb0; color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h3 { margin: 0; font-size: 18px; font-weight: bold; }
    .modal-close-btn { background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; line-height: 1; padding: 0 4px; }
    .modal-body { padding: 20px; max-height: 72vh; overflow-y: auto; font-size: 14px; }
    .case-summary-card { background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px 16px; font-size: 14px; }
    .summary-line { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .modal-footer {
      padding: 14px 20px; background: #edf2f7; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

<!-- 載入中畫面 -->
<div id="loader"><h2>系統驗證與載入中，請稍候...</h2></div>

<!-- 無權限阻擋畫面 -->
<div class="card error-card hidden" id="unauthorized-card">
  <h2 style="color: #e53e3e; justify-content: center; margin-bottom: 20px;">存取權限受限</h2>
  <p id="unauth-msg" style="font-size: 17px; line-height: 1.6; margin-bottom: 30px;"></p>
  <button onclick="reloginSSO()">切換帳號重新登入</button>
</div>

<!-- 主管理介面 -->
<div class="hidden" id="main-ui">
  <div class="card">
    <h2>
      豐東國中民意信箱 - 管理後台
      <span class="user-badge" id="userInfo"></span>
    </h2>
    <div style="text-align: right;">
      <button class="btn-outline" onclick="logout()">安全登出</button>
    </div>
  </div>

  <div class="card">
    <table id="caseTable">
      <thead>
        <tr>
          <th style="width: 130px;">案件編號</th>
          <th style="width: 100px;">日期</th>
          <th style="width: 140px;">主責處室</th>
          <th>主旨與內容</th>
          <th style="width: 160px;">陳情人資訊</th>
          <th style="width: 90px;">狀態</th>
          <th style="width: 150px;">操作 (處理/結案)</th>
        </tr>
      </thead>
      <tbody id="caseBody"></tbody>
    </table>
  </div>
</div>

<!-- 高級經典結案與回覆 Modal 視窗 -->
<div id="replyModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3>豐東民意信箱 - 案件處理與結案回覆</h3>
      <button class="modal-close-btn" onclick="closeReplyModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="case-summary-card">
        <div class="summary-line">
          <span><strong>案件編號：</strong><span id="modalCaseId" style="color:#2b6cb0; font-weight:bold;"></span></span>
          <span><strong>當前狀態：</strong><span id="modalStatusBadge"></span></span>
        </div>
        <div class="summary-line">
          <span><strong>主責處室：</strong><strong id="modalDept" style="color:#e53e3e;"></strong></span>
          <span><strong>陳情人：</strong><span id="modalSubmitter"></span></span>
        </div>
        <div style="margin-top: 6px;"><strong>信件主旨：</strong><span id="modalSubject"></span></div>
        <div style="margin-top: 6px; color:#4a5568; font-size:13px; max-height:85px; overflow-y:auto; background:#fff; padding:8px; border-radius:4px; border:1px solid #e2e8f0;">
          <strong>陳情原文：</strong><span id="modalContent"></span>
        </div>
      </div>

      <div style="margin-top: 16px;">
        <label style="display:block; font-weight:bold; margin-bottom:6px; color:#2d3748;">
          處理紀錄與結案說明 (民眾線上查詢及通知信將顯示此內容)：
        </label>
        <textarea id="modalReplyText" rows="6" style="width:100%; box-sizing:border-box; padding:10px; border:1.5px solid #cbd5e0; border-radius:6px; font-family:inherit; font-size:15px; resize:vertical;" placeholder="請輸入具體處理紀錄或結案說明..."></textarea>
      </div>

      <div style="margin-top: 14px; background:#ebf8ff; border:1px solid #bee3f8; padding:10px 14px; border-radius:6px; display:flex; align-items:center;">
        <input type="checkbox" id="modalSendEmail" style="width:18px; height:18px; margin-right:10px; cursor:pointer;" checked>
        <label for="modalSendEmail" style="cursor:pointer; font-size:14px; color:#2b6cb0; font-weight:bold; margin:0;">
          同步寄發 Email 通知信給陳情人 (<span id="modalPetitionerEmail"></span>)
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-outline" onclick="closeReplyModal()">取消</button>
      <button onclick="submitModalReply(false)" style="background:#3182ce;" id="modalBtnSaveOnly">僅儲存回覆說明</button>
      <button onclick="submitModalReply(true)" style="background:#38a169;" id="modalBtnCloseCase">確認結案並儲存</button>
    </div>
  </div>
</div>

<script>
  // ================= ⚠️ 請修改為您的 GAS API 網址 ⚠️ =================
  const API_URL = "https://script.google.com/macros/s/AKfycbxBHJQkbBM0aXBXO9OPPaKdHZAV7fF8WodVj03u_HlZsEmKQZ-Zp5pvI7gf6iB4uSZ7/exec";
  // 請修改為您的 SSO 登入頁面網址
  const SSO_LOGIN_URL = "https://sysop-coder.github.io/sso/"; 

  let g_sessionKey = sessionStorage.getItem('adminSessionKey');
  let g_availableDepts = [];
  let g_cases = [];
  let g_activeRowIndex = null;

  window.onload = async function() {
    const urlParams = new URLSearchParams(window.location.search);
    const ssoToken = urlParams.get('token');

    if (ssoToken) {
      window.history.replaceState({}, document.title, window.location.pathname);
      await processSSOToken(ssoToken);
    } else if (g_sessionKey) {
      await fetchCases();
    } else {
      reloginSSO();
    }
  };

  function reloginSSO() {
    sessionStorage.removeItem('adminSessionKey');
    const returnUrl = encodeURIComponent(window.location.origin + window.location.pathname);
    window.location.href = `${SSO_LOGIN_URL}?redirect=${returnUrl}`;
  }

  function logout() {
    sessionStorage.removeItem('adminSessionKey');
    window.location.reload();
  }

  // 向 GAS 驗證 Token
  async function processSSOToken(token) {
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "verifySSO", token: token }),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
      });
      const json = await res.json();
      
      if (json.success) {
        g_sessionKey = json.sessionKey;
        sessionStorage.setItem('adminSessionKey', g_sessionKey);
        await fetchCases();
      } else if (json.message === "NOT_AUTHORIZED") {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('unauthorized-card').classList.remove('hidden');
        document.getElementById('unauth-msg').innerHTML = `您好，<strong>${json.displayName || '同仁'}</strong>（${json.email}）：<br>您的帳號目前<strong>尚未具備</strong>本信箱的管理查核權限。如需處理陳情案件，請聯繫校長室新增授權。`;
      } else {
        alert("登入驗證失敗：" + json.message);
        reloginSSO();
      }
    } catch (e) {
      alert("網路連線錯誤，請重試。");
    }
  }

  // 抓取案件清單
  async function fetchCases() {
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "adminFetchCases", sessionKey: g_sessionKey }),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
      });
      const json = await res.json();

      if (json.success) {
        g_cases = json.data;
        g_availableDepts = json.availableDepts;
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('main-ui').classList.remove('hidden');
        document.getElementById('userInfo').innerText = `${json.user.deptPerm} - ${json.user.name}`;
        renderTable(json.data);
      } else {
        alert("Session 已過期，請重新登入。");
        reloginSSO();
      }
    } catch (e) {
      alert("無法取得資料。");
    }
  }

  // 渲染表格
  function renderTable(cases) {
    const tbody = document.getElementById('caseBody');
    tbody.innerHTML = cases.map(c => {
      const deptOptions = g_availableDepts.map(d => `<option value="${d}" ${d===c.dept?'selected':''}>${d}</option>`).join('');
      const isClosed = (c.status === '已結案');
      const actionBtnText = isClosed ? '修改回覆內容 / 重寄信' : '結案並填寫回覆';
      
      return `<tr>
        <td><strong style="color:#2b6cb0;">${c.caseId}</strong></td>
        <td>${c.createdAt}</td>
        <td>
          <strong style="color:#e53e3e">${c.dept}</strong>
          <select class="reassign-select" id="dept_${c.rowIndex}" onchange="reassignCase(${c.rowIndex}, '${c.dept}')">
            <option value="" disabled>--- 轉派案件 ---</option>
            ${deptOptions}
          </select>
        </td>
        <td style="max-width:280px;"><strong>${c.subject}</strong><br><small style="color:#4a5568;">${c.content}</small></td>
        <td><strong>${c.name}</strong><br>${c.phone}</td>
        <td><span class="status-badge tag-${c.status}">${c.status}</span></td>
        <td>
          <button onclick="markProcessing(${c.rowIndex})" style="padding:6px; font-size:13px; margin-bottom:5px; width:100%; background:#805ad5;">標記處理中</button>
          <button onclick="openReplyModal(${c.rowIndex})" style="padding:6px; font-size:13px; background:#38a169; width:100%;">${actionBtnText}</button>
        </td>
      </tr>`;
    }).join('');
  }

  // 1. 標記處理中
  async function markProcessing(rowIndex) {
    executeUpdateRequest(rowIndex, '處理中', null, null, false);
  }

  // 2. 打開結案/回覆 Modal 視窗
  function openReplyModal(rowIndex) {
    const c = g_cases.find(x => x.rowIndex === rowIndex);
    if (!c) return;

    if (c.status === '待驗證') {
      alert('此案件尚未完成 Email 驗證，無法進行結案回覆！');
      return;
    }

    g_activeRowIndex = rowIndex;

    document.getElementById('modalCaseId').innerText = c.caseId;
    document.getElementById('modalStatusBadge').innerHTML = `<span class="status-badge tag-${c.status}">${c.status}</span>`;
    document.getElementById('modalDept').innerText = c.dept;
    document.getElementById('modalSubmitter').innerText = `${c.name} (${c.phone})`;
    document.getElementById('modalSubject').innerText = c.subject;
    document.getElementById('modalContent').innerText = c.content;
    document.getElementById('modalPetitionerEmail').innerText = c.email || '未提供信箱';
    document.getElementById('modalReplyText').value = c.reply || '';

    const sendEmailCheckbox = document.getElementById('modalSendEmail');
    if (!c.email) {
      sendEmailCheckbox.checked = false;
      sendEmailCheckbox.disabled = true;
    } else {
      sendEmailCheckbox.disabled = false;
      sendEmailCheckbox.checked = true;
    }

    document.getElementById('replyModal').classList.remove('hidden');
  }

  function closeReplyModal() {
    document.getElementById('replyModal').classList.add('hidden');
    g_activeRowIndex = null;
  }

 
  // 提交 Modal 中的回覆
  async function submitModalReply(isCloseCase) {
    if (!g_activeRowIndex) return;
    const replyNotes = document.getElementById('modalReplyText').value.trim();
    const sendEmailToUser = document.getElementById('modalSendEmail').checked;
    
    if (isCloseCase && !replyNotes) {
      if (!confirm("您尚未填寫任何處理紀錄或結案說明，確定要直接結案嗎？")) {
        return;
      }
    }

    // 依據操作賦予後端對應的新狀態
    const newStatus = isCloseCase ? '已結案' : '儲存回覆';
    
    const targetRowIndex = g_activeRowIndex; 
    closeReplyModal();
    
    executeUpdateRequest(targetRowIndex, newStatus, replyNotes, null, sendEmailToUser);
  }

  // 觸發轉派
  async function reassignCase(rowIndex, oldDept) {
    const selectEl = document.getElementById(`dept_${rowIndex}`);
    const newDept = selectEl.value;
    if (newDept === oldDept) return;

    if (!confirm(`確定要將此案件由【${oldDept}】轉派給【${newDept}】嗎？\n系統將會自動寄送通知信給新處室主任。`)) {
      selectEl.value = oldDept;
      return;
    }
    executeUpdateRequest(rowIndex, null, null, newDept, false);
  }

  // 執行 API 請求
  async function executeUpdateRequest(rowIndex, status, note, newDept, sendEmailToUser) {
    try {
      const payload = { action: "adminUpdateCase", sessionKey: g_sessionKey, rowIndex: rowIndex };
      if (status) payload.status = status;
      if (note !== null && note !== undefined) payload.replyNotes = note;
      if (newDept) payload.newDept = newDept;
      if (sendEmailToUser) payload.sendEmailToUser = true;

      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
      });
      const json = await res.json();
      if (json.success) {
        fetchCases();
      } else {
        alert("更新失敗: " + json.message);
      }
    } catch (e) {
      alert("連線失敗，請檢查網路。");
    }
  }
</script>
</body>
</html>
